# Server
server.port=5000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fleetflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL Auto - creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:super-secret-key-change-me-fleetflow-2024-very-long-key}
app.jwt.expiration-ms=604800000

# Logging
logging.level.com.fleetflow=DEBUG
logging.level.org.springframework.security=INFO

# Disable Spring Security auto-configuration prompt
spring.main.banner-mode=off
